worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 5m;

    # The server block lives in /etc/nginx/templates/default.conf.template.
    # nginx:alpine's entrypoint runs envsubst on it at container start and
    # writes the result here — this is how the NAI_API_KEY env var (from a
    # Kubernetes Secret) gets injected without ever being baked into the
    # image or committed to Git.
    include /etc/nginx/conf.d/*.conf;
}
