apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-ai-portal
  labels:
    app.kubernetes.io/name: legal-ai-portal
    app.kubernetes.io/component: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legal-ai-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legal-ai-portal
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/script-repo/ucdemo-003-legal/portal:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: legal-ai-config
          env:
            # Injected into nginx's server block at container start via
            # envsubst — see nginx/default.conf.template. Real value comes
            # from a Secret created out of band (deploy/gitops/README.md).
            - name: NAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: legal-ai-secrets
                  key: NAI_API_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Writable scratch for a read-only root filesystem.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
            # envsubst writes the rendered server block here at start-up.
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
        - name: db-api
          image: ghcr.io/script-repo/ucdemo-003-legal/db-api:main
          imagePullPolicy: Always
          ports:
            - name: db-api
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: legal-ai-config
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: legal-ai-secrets
                  key: PG_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: db-api
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-conf-d
          emptyDir: {}
        - name: tmp
          emptyDir: {}
