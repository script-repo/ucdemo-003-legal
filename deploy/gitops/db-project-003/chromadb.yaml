# ChromaDB: vector store for future RAG-based use cases (clause/precedent
# embeddings). Not yet called by any live use case — kept provisioned ahead
# of need, same as in the prior deployment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: legal-ai-chroma-data
  labels:
    app.kubernetes.io/name: legal-ai-chroma
    app.kubernetes.io/component: vector-db
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nutanix-volume
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-ai-chroma
  labels:
    app.kubernetes.io/name: legal-ai-chroma
    app.kubernetes.io/component: vector-db
spec:
  replicas: 1 # ReadWriteOnce — do not scale this up.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: legal-ai-chroma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legal-ai-chroma
        app.kubernetes.io/component: vector-db
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: PERSIST_DIRECTORY
              value: "/chroma/chroma"
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          volumeMounts:
            - name: data
              mountPath: /chroma/chroma
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: legal-ai-chroma-data
---
apiVersion: v1
kind: Service
metadata:
  # Name matches CH_DB_HOST in configmap.yaml.
  name: ch-db
  labels:
    app.kubernetes.io/name: legal-ai-chroma
    app.kubernetes.io/component: vector-db
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: legal-ai-chroma
  ports:
    - name: http
      port: 8000
      targetPort: http
