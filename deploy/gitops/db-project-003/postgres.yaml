# PostgreSQL: persists document-summary history (uc03 and future use cases).
# Uses a PVC because pod restarts must not lose data — unlike the stateless
# portal, this is exactly the case where a disk belongs in the overlay.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: legal-ai-pg-data
  labels:
    app.kubernetes.io/name: legal-ai-pg
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nutanix-volume
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-ai-pg
  labels:
    app.kubernetes.io/name: legal-ai-pg
    app.kubernetes.io/component: database
spec:
  replicas: 1 # ReadWriteOnce — do not scale this up.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: legal-ai-pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legal-ai-pg
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: legal-ai-config
                  key: PG_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: legal-ai-config
                  key: PG_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: legal-ai-secrets
                  key: PG_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: legal-ai-pg-data
---
apiVersion: v1
kind: Service
metadata:
  # Name matches PG_HOST in configmap.yaml — db-api resolves this via
  # cluster DNS as pg-db.db-project-003.svc.cluster.local.
  name: pg-db
  labels:
    app.kubernetes.io/name: legal-ai-pg
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: legal-ai-pg
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
